const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function easeOut(t){return 1-Math.pow(1-t,3);}
function easeIn(t){return t*t*t;}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function easeInOut(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

const Sfx = window.Sfx = {

    if(this.ctx) return true;

    this.tone(110,80,0.20,"sine",0.08,0.02);
  },
  undoSfx(){ this.tone(620,240,0.16,"sine",0.10); this.noise(0.12,0.05,0,2400,900,1.2); },
  hintSfx(){ this.tone(880,1760,0.18,"sine",0.08); this.tone(1320,2640,0.14,"sine",0.05,0.06); },
  star(i){
    const f=880*Math.pow(1.2,i);
    this.tone(f,f,0.16,"triangle",0.10);
    this.tone(f*2,f*2,0.12,"sine",0.05,0.02);
  },
  win(){
    const n=[523.3,659.3,784,1046.5,1318.5];
    n.forEach((f,i)=>{ this.tone(f,f,0.22,"triangle",0.10,i*0.10); this.tone(f/2,f/2,0.22,"sine",0.05,i*0.10); });
    this.thump(0.14,0.45);
    this.noise(0.5,0.05,0.3,3000,7000,1.0);
  },
  lose(){
    const n=[330,262,196,147];
    n.forEach((f,i)=>this.tone(f,f*0.92,0.26,"sawtooth",0.07,i*0.17));
    this.thump(0.20,0.55);
  },

  /* ----- generative workshop groove (subtle) ----- */
  gesture(){
    if(!this.ensure()) return;
    try{ if(this.ctx.state==="suspended") this.ctx.resume(); }catch(e){}
    this._musicWanted=true;
    this.startMusic();
  },
  startMusic(){
    if(this._musicOn||this.muted||!this._musicWanted||!this.ensure()) return;
    this._musicOn=true; this._mStep=0;
    this._mNext=this.ctx.currentTime+0.15;
    if(!this._mTimer) this._mTimer=setInterval(()=>{ try{ this._sched(); }catch(e){} },120);
  },
  onShow(){
    if(this._musicOn&&this.ctx) this._mNext=Math.max(this._mNext,this.ctx.currentTime+0.1);
  },
  _tick(t,hi){
    const ctx=this.ctx, s=ctx.createBufferSource(); s.buffer=this._noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type="bandpass"; f.Q.value=3;
    f.frequency.value=hi?5200:3400;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.028,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
    s.connect(f); f.connect(g); g.connect(this._musicBus);
    s.start(t); s.stop(t+0.1);
  },
  _pulse(t){
    const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=55;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.055,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g); g.connect(this._musicBus); o.start(t); o.stop(t+0.6);
  },
  _pluckM(m,t){
    const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=this.mf(m);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.045,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.9);
    o.connect(g); g.connect(this._musicBus); o.start(t); o.stop(t+1);
  },
  _sched(){
    if(!this._musicOn||this.muted||!this.ctx) return;
    if(typeof document!=="undefined"&&document.hidden){ this._mNext=this.ctx.currentTime+0.15; return; }
    const STEP=0.25; // 8th-note-ish ticks
    const PENTA=[57,60,62,64,67,69,72]; // A minor pentatonic-ish
    if(this._mNext<this.ctx.currentTime-0.5) this._mNext=this.ctx.currentTime+0.1;
    while(this._mNext<this.ctx.currentTime+0.5){
      const s=this._mStep, t=this._mNext;
      if(s%2===0) this._tick(t,(s%8)===4);
      if(s%8===0) this._pulse(t);
      if(s%16===12 && Math.random()<0.7) this._pluckM(pick(PENTA),t);
      this._mNext+=STEP; this._mStep++;
    }
  },
};

/* ---------------- canvas setup ---------------- */
const LW=480, LH=800;
const canvas = document.getElementById("c");
const ctx = canvas ? canvas.getContext("2d", {alpha:false, desynchronized:true}) : null;
let SPR_DPR=2;
function effDPR(){ return clamp(window.devicePixelRatio||1, 2, 3); }
function fitCanvas(){
  if(!canvas) return;
  const ww=window.innerWidth||LW, wh=window.innerHeight||LH;
  const s=Math.min(ww/LW, wh/LH);
  const dpr=effDPR();
  canvas.width=Math.round(LW*s*dpr);
  canvas.height=Math.round(LH*s*dpr);
  canvas.style.width=Math.round(LW*s)+"px";
  canvas.style.height=Math.round(LH*s)+"px";
  if(ctx) ctx.setTransform(canvas.width/LW,0,0,canvas.height/LH,0,0);
  try{ buildSprites(dpr); }catch(e){}
}
if(typeof window!=="undefined" && window.addEventListener){
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", ()=>setTimeout(fitCanvas,120));
}

/* ---------------- drawing helpers ---------------- */
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function font(w,s){ return w+" "+s+"px "+SYSFONT; }
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(f<=1){ r*=f; g*=f; b*=f; } else { r+=(255-r)*(f-1); g+=(255-g)*(f-1); b+=(255-b)*(f-1); }
  r=Math.min(255,Math.round(r)); g=Math.min(255,Math.round(g)); b=Math.min(255,Math.round(b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function gloss(c,x,y,w,h,r,alpha){
  r=Math.min(r,w/2,h/2);
  c.save(); rr(c,x,y,w,h,r); c.clip();
  const g=c.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,"rgba(255,255,255,"+(alpha==null?0.35:alpha)+")");
  g.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=g; c.fillRect(x,y,w,h);
  c.restore();
}
function spaced(px){ try{ ctx.letterSpacing=px+"px"; }catch(e){} }
function unspaced(){ try{ ctx.letterSpacing="0px"; }catch(e){} }
function makeLayer(w,h){
  const c=document.createElement("canvas");
  c.width=Math.max(2,Math.round(w*SPR_DPR)); c.height=Math.max(2,Math.round(h*SPR_DPR));
  const g=c.getContext("2d"); g.setTransform(SPR_DPR,0,0,SPR_DPR,0,0);
  return {img:c, g:g, w:w, h:h};
}

/* ---------------- sprites (prerendered, visual only) ---------------- */
const Sprites={ bg:null, gears:{}, plates:{}, screws:{}, holes:{}, ui:{} };

function gearSprite(r, teeth){
  const key=r+"_"+teeth;
  let s=Sprites.gears[key];
  if(s) return s;
  const d=(r+8)*2, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  c.fillStyle="rgba(255,255,255,0.05)";
  c.beginPath();
  for(let i=0;i<teeth;i++){
    const a0=i/teeth*Math.PI*2, a1=(i+0.35)/teeth*Math.PI*2, a2=(i+0.5)/teeth*Math.PI*2, a3=(i+0.85)/teeth*Math.PI*2;
    if(i===0) c.moveTo(cx+Math.cos(a0)*(r+8), cy+Math.sin(a0)*(r+8));
    else c.lineTo(cx+Math.cos(a0)*(r+8), cy+Math.sin(a0)*(r+8));
    c.lineTo(cx+Math.cos(a1)*(r+8), cy+Math.sin(a1)*(r+8));
    c.lineTo(cx+Math.cos(a2)*r, cy+Math.sin(a2)*r);
    c.lineTo(cx+Math.cos(a3)*r, cy+Math.sin(a3)*r);
  }
  c.closePath(); c.fill();
  c.globalCompositeOperation="destination-out";
  c.beginPath(); c.arc(cx,cy,r*0.42,0,7); c.fill();
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2;
    c.beginPath(); c.arc(cx+Math.cos(a)*r*0.68, cy+Math.sin(a)*r*0.68, r*0.13, 0, 7); c.fill();
  }
  s={img:L.img,w:d,h:d};
  Sprites.gears[key]=s; return s;
}

function paintBackground(){
  const L=makeLayer(LW,LH), c=L.g;
  // workshop wall
  let g=c.createLinearGradient(0,0,0,LH);
  g.addColorStop(0,"#1b2340"); g.addColorStop(0.55,"#141b31"); g.addColorStop(1,"#0e1425");
  c.fillStyle=g; c.fillRect(0,0,LW,LH);
  // wall panels
  c.strokeStyle="rgba(255,255,255,0.045)"; c.lineWidth=2;
  for(let x=40;x<LW;x+=110){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,600); c.stroke(); }
  c.fillStyle="rgba(255,255,255,0.05)";
  for(let x=40;x<LW;x+=110) for(let y=60;y<600;y+=130){
    c.beginPath(); c.arc(x+6,y+6,3,0,7); c.fill();
  }
  // warm lamp glow top-left
  const lg=c.createRadialGradient(90,60,10,90,60,260);
  lg.addColorStop(0,"rgba(255,190,110,0.16)"); lg.addColorStop(1,"rgba(255,190,110,0)");
  c.fillStyle=lg; c.fillRect(0,0,LW,340);
  // workbench floor
  g=c.createLinearGradient(0,592,0,LH);
  g.addColorStop(0,"#2b3350"); g.addColorStop(0.12,"#232b45"); g.addColorStop(1,"#161c30");
  c.fillStyle=g; c.fillRect(0,592,LW,LH-592);
  c.fillStyle="rgba(255,255,255,0.09)"; c.fillRect(0,592,LW,4);
  c.strokeStyle="rgba(0,0,0,0.30)"; c.lineWidth=2;
  for(let x=0;x<LW;x+=80){ c.beginPath(); c.moveTo(x,600); c.lineTo(x,LH); c.stroke(); }
  c.fillStyle="rgba(0,0,0,0.35)";
  for(let x=40;x<LW;x+=80){ c.beginPath(); c.arc(x,640,4,0,7); c.fill(); c.beginPath(); c.arc(x,740,4,0,7); c.fill(); }
  // vignette
  const vg=c.createRadialGradient(LW/2,LH/2,LH*0.36,LW/2,LH/2,LH*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(3,6,14,0.42)");
  c.fillStyle=vg; c.fillRect(0,0,LW,LH);
  Sprites.bg=L.img;
}

function plateSprite(w,h){
  const key=w+"x"+h;
  let s=Sprites.plates[key];
  if(s) return s;
  const L=makeLayer(w,h), c=L.g;
  // drop shadow baked under? no — dynamic shadow drawn separately for popped anim.
  let g=c.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#aeb9cf"); g.addColorStop(0.35,"#8b98b3");
  g.addColorStop(0.7,"#6e7b96"); g.addColorStop(1,"#59657f");
  c.fillStyle=g; rr(c,0,0,w,h,14); c.fill();
  // brushed metal streaks
  c.save(); rr(c,0,0,w,h,14); c.clip();
  c.strokeStyle="rgba(255,255,255,0.10)"; c.lineWidth=1;
  let seed=1234567;
  const srnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  for(let i=0;i<26;i++){
    const y=srnd()*h;
    c.globalAlpha=0.05+srnd()*0.08;
    c.beginPath(); c.moveTo(0,y); c.lineTo(w,y+srnd()*6-3); c.stroke();
  }
  c.globalAlpha=1; c.restore();
  // border
  c.lineWidth=3; c.strokeStyle="rgba(20,26,44,0.85)"; rr(c,1.5,1.5,w-3,h-3,13); c.stroke();
  c.lineWidth=1.5; c.strokeStyle="rgba(255,255,255,0.35)"; rr(c,5,5,w-10,h-10,10); c.stroke();
  gloss(c,4,4,w-8,h-8,11,0.22);
  // corner rivets (decorative; screws sit on top)
  s={img:L.img,w:w,h:h};
  Sprites.plates[key]=s; return s;
}

function screwSprite(ci){
  // robot screw head with a cute face — the brand centerpiece
  let s=Sprites.screws[ci];
  if(s) return s;
  const col=COLORS[ci], R=21, d=R*2+10, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  // outer dark ring (thread)
  c.fillStyle=shade(col.dark,0.55);
  c.beginPath(); c.arc(cx,cy,R,0,7); c.fill();
  c.strokeStyle="rgba(0,0,0,0.45)"; c.lineWidth=2;
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    c.beginPath();
    c.moveTo(cx+Math.cos(a)*(R-1), cy+Math.sin(a)*(R-1));
    c.lineTo(cx+Math.cos(a)*(R-5), cy+Math.sin(a)*(R-5));
    c.stroke();
  }
  // head dome
  const hg=c.createRadialGradient(cx-5,cy-6,2,cx,cy,R-4);
  hg.addColorStop(0,col.light); hg.addColorStop(0.55,col.main); hg.addColorStop(1,col.dark);
  c.fillStyle=hg; c.beginPath(); c.arc(cx,cy,R-4,0,7); c.fill();
  c.lineWidth=2; c.strokeStyle="rgba(0,0,0,0.35)";
  c.beginPath(); c.arc(cx,cy,R-4,0,7); c.stroke();
  gloss(c,cx-(R-4),cy-(R-4),(R-4)*2,(R-4)*2,R-4,0.35);
  // screw slot (rotated at draw time)
  // robot face: eyes
  for(const ex of [-6.5,6.5]){
    c.fillStyle="#fff"; c.beginPath(); c.arc(cx+ex,cy-4,5.2,0,7); c.fill();
    c.fillStyle="#1c2438"; c.beginPath(); c.arc(cx+ex,cy-3.4,2.6,0,7); c.fill();
    c.fillStyle="#fff"; c.beginPath(); c.arc(cx+ex+0.9,cy-4.4,1,0,7); c.fill();
  }
  // smile
  c.strokeStyle="rgba(20,26,44,0.75)"; c.lineWidth=2; c.lineCap="round";
  c.beginPath(); c.arc(cx,cy+5,5,0.4,Math.PI-0.4); c.stroke();
  s={img:L.img,w:d,h:d,cx:cx,cy:cy,r:R};
  Sprites.screws[ci]=s; return s;
}

function holeSprite(r){
  const key="h"+r;
  let s=Sprites.holes[key];
  if(s) return s;
  const d=r*2+8, L=makeLayer(d,d), c=L.g, cx=d/2, cy=d/2;
  c.fillStyle="rgba(0,0,0,0.55)";
  c.beginPath(); c.arc(cx,cy,r,0,7); c.fill();
  const ig=c.createRadialGradient(cx,cy,r*0.3,cx,cy,r);
  ig.addColorStop(0,"rgba(0,0,0,0.75)"); ig.addColorStop(1,"rgba(0,0,0,0.25)");

  c.strokeStyle="rgba(255,255,255,0.22)"; c.lineWidth=2.5;

  c.strokeStyle="rgba(255,209,102,0.30)"; c.lineWidth=1.5;

  s={img:L.img,w:d,h:d,cx:cx,cy:cy};
  Sprites.holes[key]=s; return s;
}

function buildSprites(dpr){
  SPR_DPR=dpr||SPR_DPR;
  Sprites.gears={}; Sprites.plates={}; Sprites.screws={}; Sprites.holes={}; Sprites.ui={};
  try{ paintBackground(); }catch(e){}
}

/* ================= SOLVER (hint + test autoWin; logic-identical to the Python verifier) ================= */
function solveState(remIds, trayCounts, plates, screws, K, H, budgetMs){
  const t0=(typeof performance!=="undefined")?performance.now():Date.now();
  const now=()=>(typeof performance!=="undefined")?performance.now():Date.now();
  const plateOf=[], colorOf=[], pinned=[];
  for(const s of screws){ plateOf[s.id]=s.plate; colorOf[s.id]=s.color; pinned[s.id]=s.pinned?1:0; }
  const player=plates.map(p=>p.layer);
  const prect=plates.map(p=>[p.x,p.y,p.x+p.w,p.y+p.h]);
  const covers={};
  for(const s of screws){
    const cov=[];
    for(let q=0;q<plates.length;q++){
      if(q===s.plate||player[q]<=player[s.plate]) continue;
      const r=prect[q];
      if(r[0]<=s.x&&s.x<=r[2]&&r[1]<=s.y&&s.y<=r[3]) cov.push(q);
    }
    covers[s.id]=cov;
  }
  const dead=new Set();
  let nodes=0;
  function unblocked(rem){
    const active=new Set();
    for(const id of rem) active.add(plateOf[id]);
    const out=[];
    for(const id of rem){
      const p=plateOf[id];
      if(pinned[id]){
        let cnt=0;
        for(const j of rem) if(plateOf[j]===p && ++cnt>1) break;
        if(cnt>1) continue;
      }
      let bad=false;
      const cv=covers[id];
      for(let k=0;k<cv.length;k++) if(active.has(cv[k])){ bad=true; break; }
      if(!bad) out.push(id);
    }
    return out;
  }
  function dfs(rem, tc){
    if(rem.length===0) return [];
    if((++nodes&511)===0 && now()-t0>budgetMs) throw 0;
    let occ=0; for(let i=0;i<tc.length;i++) occ+=tc[i];
    if(occ>=H) return null;
    const key=rem.join(",")+"|"+tc.join("");
    if(dead.has(key)) return null;
    const cands=unblocked(rem);
    if(!cands.length){ dead.add(key); return null; }
    cands.sort((a,b)=>tc[colorOf[b]]-tc[colorOf[a]]);
    for(let ci=0;ci<cands.length;ci++){
      const id=cands[ci], c=colorOf[id];
      const tc2=tc.slice(); tc2[c]++; if(tc2[c]===3) tc2[c]=0;
      const rem2=[]; for(let k=0;k<rem.length;k++) if(rem[k]!==id) rem2.push(rem[k]);
      const r=dfs(rem2,tc2);
      if(r){ r.unshift(id); return r; }
    }
    dead.add(key); return null;
  }
  try{ return dfs(remIds.slice(), trayCounts.slice()); }catch(e){ return null; }
}

  levelIdx:0, unlocked:1, stars:{}, coins:0, muted:false,
  completions:0, seenTut:false,
  L:null,           // live level state

};

function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

Game.autoPause=function(on){
  if(on && this.screen==="play"){ this.pausedByAd=true; this.screen="pause"; }
  else if(!on && this.pausedByAd){ this.pausedByAd=false; this.screen="play"; }

/* ---------- level lifecycle ---------- */
Game.loadLevel=function(idx){
  const spec=LEVELS[idx];
  const holes=spec[0], par=spec[1];
  const plates=spec[2].map((p,pi)=>({
    x:p[0], y:p[1], w:p[2], h:p[3], layer:p[4],
    popped:false, popT:0,
    screws: p[5].map((s,si)=>({ id: pi*100+si, plate: pi, color: s[2], pinned: !!s[3],
      dx:s[0], dy:s[1], x: p[0]+s[0], y: p[1]+s[1], rot: rnd(0,6.28),
      state:"plate", hole:-1, denyT:0 }))
  }));
  const screws=[];
  plates.forEach(p=>p.screws.forEach(s=>screws.push(s)));
  const K=Math.max.apply(null, screws.map(s=>s.color).concat([0]))+1;
  this.L={
    idx, holes, par, K, plates, screws,
    rem: screws.map(s=>s.id),
    tray: new Array(holes).fill(null),   // screw ids or null
    counts: new Array(K).fill(0), clearedBy: new Array(K).fill(0),
    score:0, moves:0, undosLeft:3, undosUsed:0, cleared:0,
    startT: this.time, elapsed:0,
    flights:[],       // visual screw flights {screw, fx,fy, tx,ty, t,dur, phase, hole}
    clearing:[],      // visual trio flights {screw, fx,fy, t}
    undoStack:[],
    hintId:-1, hintCd:0,
    undoCd:0,
    winT:-1, loseT:-1, won:false,
    tutDone: this.seenTut,
    popQueue:0,
  };
  this.parts=[]; this.floats=[];
  this.screen="play";
  try{ Portal.gameplayStart(); }catch(e){}
};

Game._smap=null;
Game.screwById=function(id){
  if(!this._smap||this._smapL!==this.L){
    this._smap={}; this._smapL=this.L;
    if(this.L) for(const s of this.L.screws) this._smap[s.id]=s;
  }
  return this._smap[id];
};

Game.isBlocked=function(s){
  const L=this.L, p=L.plates[s.plate];
  if(s.state!=="plate") return true;
  if(s.pinned){
    let cnt=0;
    for(const id of L.rem){ const o=this.screwById(id); if(o&&o.plate===s.plate&&++cnt>1) return true; }
  }
  for(const q of L.plates){
    if(q.popped||q.layer<=p.layer||q===p) continue;
    if(s.x>=q.x&&s.x<=q.x+q.w&&s.y>=q.y&&s.y<=q.y+q.h) return true;
  }
  return false;
};

Game.tappable=function(){
  const L=this.L, out=[];
  for(const id of L.rem){
    const s=this.screwById(id);
    if(s&&s.state==="plate"&&!this.isBlocked(s)) out.push(id);
  }
  out.sort((a,b)=>a-b);
  return out;
};

Game.freeHole=function(){
  const L=this.L;
  for(let i=0;i<L.holes;i++) if(L.tray[i]===null||L.tray[i]===undefined) return i;
  return -1;
};

/* ---------- core action: tap a screw ---------- */
Game.tapScrewById=function(id){
  const L=this.L;
  if(!L||this.screen!=="play") return false;
  const s=this.screwById(id);
  if(!s||s.state!=="plate"||this.isBlocked(s)) return false;
  const hole=this.freeHole();
  if(hole<0){
    s.denyT=350; Sfx.deny(); vibrate(30);
    this.floater(s.x,s.y-30,"TRAY FULL!","#f87171",16);
    return false;
  }
  // snapshot for undo (logic state only — instant)
  L.undoStack.push(this.snap());
  if(L.undoStack.length>60) L.undoStack.shift();
  // logic (instant; visuals catch up)
  L.rem=L.rem.filter(x=>x!==id);
  s.state="tray"; s.hole=hole;
  L.tray[hole]=id;
  L.counts[s.color]++;
  L.moves++; L.score+=10;
  L.hintId=-1;
  if(!L.tutDone){ L.tutDone=true; this.seenTut=true; Store.set("seenTut","1"); }
  // visuals: unscrew then fly
  L.flights.push({screw:s, fx:s.x, fy:s.y, tx:holeX(hole,L.holes), ty:TRAY_Y,
    t:0, dur:520, phase:"unscrew", hole:hole});
  Sfx.ratchet(); vibrate(12);
  try{ Portal.scoreChanged(L.score); }catch(e){}
  // trio clear?
  if(L.counts[s.color]>=3) this.clearTrio(s.color);
  // plate pop?
  const p=L.plates[s.plate];
  let anyLeft=false;
  for(const q of p.screws) if(q.state==="plate"){ anyLeft=true; break; }
  if(!anyLeft&&!p.popped){
    p.popped=true; p.popT=0.0001; L.popQueue++;
    L.score+=50;
    this.plateBurst(p);
    Sfx.pop(); vibrate(35);
    this.shake=Math.max(this.shake,200);
    this.floater(p.x+p.w/2, p.y+10, "+50", "#fde047", 18);
  }
  this.checkEnd();
  return true;
};

Game.clearTrio=function(color){
  const L=this.L;
  const ids=[];
  for(let i=0;i<L.holes&&ids.length<3;i++){
    const id=L.tray[i];
    if(id!=null){ const s=this.screwById(id); if(s&&s.color===color) ids.push(i); }
  }
  if(ids.length<3) return;
  for(const h of ids){
    const id=L.tray[h], s=this.screwById(id);
    L.tray[h]=null;
    if(s){ L.clearing.push({screw:s, fx:s.x, fy:s.y, t:0}); s.state="gone"; }
  }
  L.counts[color]=0;
  L.clearedBy[color]+=3;
  L.cleared+=3; L.score+=25;
  Sfx.triple(); vibrate(20);
  this.sparkle(400,640,COLORS[color].light,10);
  this.floater(400,610,"SORTED! +25","#4ade80",17);
};

Game.checkEnd=function(){
  const L=this.L;
  if(!L||L.won||L.winT>=0||L.loseT>=0) return;
  if(L.rem.length===0){ L.winT=750; return; }
  let occ=0, mx=0;
  for(let i=0;i<L.holes;i++) if(L.tray[i]!=null) occ++;
  for(let c=0;c<L.K;c++) mx=Math.max(mx,L.counts[c]);
  if(occ>=L.holes&&mx<3&&L.rem.length>0){ L.loseT=900; }
};

Game.onWin=function(){
  const L=this.L;
  L.won=true;
  const t=(this.time-L.startT)/1000;
  L.elapsed=t;
  let stars=1;
  if(L.undosUsed===0&&t<=L.par) stars=3;
  else if(L.undosUsed<=2&&t<=L.par*1.6) stars=2;
  L.stars=stars;
  const prev=this.stars[this.levelIdx]||0;
  if(stars>prev){ this.stars[this.levelIdx]=stars; Store.set("stars",JSON.stringify(this.stars)); }
  if(this.levelIdx+1<LEVELS.length&&this.unlocked<this.levelIdx+2){
    this.unlocked=this.levelIdx+2; Store.set("unlocked",String(this.unlocked));
  }
  const bonus=50+stars*25;
  this.coins+=bonus+Math.floor(L.score/10);
  Store.set("coins",String(this.coins));
  this.completions++;
  Store.set("completions",String(this.completions));
  this.screen="win";
  L.winFxT=0;
  Sfx.win(); vibrate([40,60,40]);
  try{ Portal.gameplayStop(); }catch(e){}
};

Game.onLose=function(){
  this.screen="lose";
  Sfx.lose(); vibrate([80,50,80]);
  try{ Portal.gameplayStop(); }catch(e){}
};

/* ---------- undo / hint ---------- */
Game.snap=function(){
  const L=this.L;
  return { rem:L.rem.slice(), tray:L.tray.slice(), counts:L.counts.slice(),
    clearedBy:L.clearedBy.slice(),
    popped:L.plates.map(p=>p.popped), score:L.score, moves:L.moves,
    undosUsed:L.undosUsed, cleared:L.cleared };
};
Game.restore=function(sn){
  const L=this.L;
  L.rem=sn.rem.slice(); L.tray=sn.tray.slice(); L.counts=sn.counts.slice();
  L.clearedBy=sn.clearedBy.slice();
  L.score=sn.score; L.moves=sn.moves; L.undosUsed=sn.undosUsed; L.cleared=sn.cleared;
  L.plates.forEach((p,i)=>{ p.popped=sn.popped[i]; if(!p.popped) p.popT=0; });
  const onPlate=new Set(L.rem), inTray=new Map();
  L.tray.forEach((id,h)=>{ if(id!=null) inTray.set(id,h); });
  for(const s of L.screws){
    if(onPlate.has(s.id)){ s.state="plate"; s.hole=-1; }
    else if(inTray.has(s.id)){ s.state="tray"; s.hole=inTray.get(s.id); }
    else { s.state="gone"; s.hole=-1; }
  }
  L.flights=[]; L.clearing=[]; L.hintId=-1; L.winT=-1; L.loseT=-1; L.won=false;
};

Game.doUndo=function(){
  const L=this.L;
  if(!L||this.screen!=="play") return;
  if(L.undosLeft<=0){
    this.grantViaAdOrCooldown("undo",()=>{
      L.undosLeft+=2; Sfx.hintSfx();
      this.floater(240,480,"+2 UNDO","#4ade80",18);
    },"undo");
    return;
  }
  const sn=L.undoStack.pop();
  if(!sn){ Sfx.deny(); return; }
  L.undosLeft--; L.undosUsed++;
  this.restore(sn);
  Sfx.undoSfx();
  this.floater(240,480,"UNDO","#93c5fd",18);
};

Game.doHint=function(){
  const L=this.L;
  if(!L||this.screen!=="play"||L.hintId>=0) return;
  const use=()=>{
    const rem=L.rem.filter(id=>{ const s=this.screwById(id); return s&&s.state==="plate"; });
    let sol=null;
    try{ sol=solveState(rem,L.counts.slice(),L.plates,L.screws,L.K,L.holes,300); }catch(e){ sol=null; }
    let id=-1;
    if(sol&&sol.length){
      id=sol[0];
      const s=this.screwById(id);
      if(!s||this.isBlocked(s)) id=-1;
    }
    if(id<0){
      // heuristic fallback: color with most in tray, else any tappable
      const tap=this.tappable();
      if(!tap.length){ Sfx.deny(); return; }
      let best=tap[0], bs=-1;
      for(const tid of tap){
        const s=this.screwById(tid), sc=L.counts[s.color]*10+(s.pinned?0:1);
        if(sc>bs){ bs=sc; best=tid; }
      }
      id=best;
    }
    L.hintId=id;
    Sfx.hintSfx();
  };
  this.grantViaAdOrCooldown("hint",use,"hint");
};

Game.grantViaAdOrCooldown=function(kind,grant,label){
  const L=this.L;
  const P=(typeof window!=="undefined")?window.Portal:null;
  if(P&&typeof P.rewarded==="function"){
    try{ P.rewarded(function(ok){ if(ok){ try{grant();}catch(e){} } }); }catch(e){}
    return;
  }
  const now=Date.now(), last=L["cd_"+kind]||0, WAIT=90000;
  if(now-last>=WAIT){ L["cd_"+kind]=now; try{grant();}catch(e){} }
  else{
    const s=Math.ceil((WAIT-(now-last))/1000);
    Sfx.deny();
    this.floater(240,480,"FREE "+label.toUpperCase()+" IN "+s+"s","#f87171",16);
  }
};

/* ---------- particles / floaters ---------- */
Game.sparkle=function(x,y,col,n){
  for(let i=0;i<(n||8);i++)
    this.parts.push({x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-120,120),vy:rnd(-180,-30),
      life:rnd(350,700),t:0,col:col,r:rnd(2,4),g:700});
};
Game.plateBurst=function(p){
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  for(let i=0;i<26;i++)
    this.parts.push({x:cx+rnd(-p.w/3,p.w/3),y:cy+rnd(-p.h/3,p.h/3),
      vx:rnd(-220,220),vy:rnd(-320,-40),life:rnd(600,1200),t:0,
      col:pick(["#aeb9cf","#8b98b3","#fde047","#ffffff"]),r:rnd(3,6),g:800,rect:1,rot:rnd(0,6.28),vr:rnd(-8,8)});
  for(let i=0;i<10;i++) this.sparkle(cx+rnd(-40,40),cy+rnd(-20,20),"#fde047",1);
};
Game.floater=function(x,y,txt,col,size){
  this.floats.push({x:x,y:y,txt:txt,col:col||"#fff",size:size||16,t:0,life:1200});
};

/* ---------- tick ---------- */
Game.tick=function(dt){
  this.time+=dt;
  if(this.shake>0) this.shake=Math.max(0,this.shake-dt*1.4);
  if(this.fade>0) this.fade=Math.max(0,this.fade-dt);
  this.floats.forEach(f=>{f.t+=dt; f.y-=36*dt/1000;});
  this.floats=this.floats.filter(f=>f.t<f.life);
  this.parts.forEach(p=>{ p.t+=dt; p.vy+=p.g*dt/1000; p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; if(p.vr) p.rot+=p.vr*dt/1000; });
  this.parts=this.parts.filter(p=>p.t<p.life&&p.y<860);
  const L0=this.L;
  if(L0&&L0.winFxT!=null) L0.winFxT+=dt;   // win-screen star animation runs on any screen
  if(this.screen!=="play"||!this.L) return;
  const L=this.L;
  // screw flights
  for(let i=L.flights.length-1;i>=0;i--){
    const f=L.flights[i];
    f.t+=dt;
    if(f.phase==="unscrew"){
      const k=clamp(f.t/200,0,1);
      f.screw.rot+=dt/1000*22;
      if(k>=1){ f.phase="fly"; f.t=0; }
    }else{
      const k=clamp(f.t/320,0,1), e=easeInOut(k);
      if(k>=1){
        L.flights.splice(i,1);
        const s=f.screw;
        s.x=f.tx; s.y=f.ty;
        Sfx.clink();
        this.sparkle(f.tx,f.ty,"#ffffff",5);
      }
    }
  }
  // trio clearing flights (to the bin)
  for(let i=L.clearing.length-1;i>=0;i--){
    const c=L.clearing[i];
    c.t+=dt;
    const k=clamp(c.t/450,0,1), e=easeIn(k);
    c.screw.x=lerp(c.fx,BIN_X,e); c.screw.y=lerp(c.fy,BIN_Y,e)-Math.sin(k*Math.PI)*60;
    c.screw.rot+=dt/1000*18;
    if(k>=1){ L.clearing.splice(i,1); this.sparkle(BIN_X,BIN_Y,"#4ade80",6); }
  }
  // popped plates anim
  for(const p of L.plates){
    if(p.popped&&p.popT<1){ p.popT=Math.min(1,p.popT+dt/650); }
  }
  if(L.popQueue>0){
    let done=true;
    for(const p of L.plates) if(p.popped&&p.popT<1){ done=false; break; }
    if(done) L.popQueue=0;
  }
  if(L.hintCd>0) L.hintCd-=dt;
  if(L.winT>0){ L.winT-=dt; if(L.winT<=0){ L.winT=-1; this.onWin(); } }
  else if(L.loseT>0){ L.loseT-=dt; if(L.loseT<=0){ L.loseT=-1; this.onLose(); } }
};
function hit(x,y,r){ return r&&x>=r.x&&y>=r.y&&x<=r.x+r.w&&y<=r.y+r.h; }

function drawBackground(){

function drawScrew(s,x,y,scale,alpha,dimmed){
  const sp=screwSprite(s.color);
  const sc=scale||1;
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  if(dimmed) ctx.globalAlpha*=0.45;
  const dx=s.denyT>0?Math.sin(Game.time/26)*5:0;
  const w=sp.w*sc, h=sp.h*sc;
  ctx.drawImage(sp.img,x-w/2+dx,y-h/2,w,h);
  // rotating slot
  ctx.save();
  ctx.translate(x+dx,y); ctx.rotate(s.rot||0);
  ctx.strokeStyle="rgba(15,20,36,0.85)"; ctx.lineWidth=4*sc; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-9*sc,0); ctx.lineTo(9*sc,0); ctx.stroke();
  ctx.restore();
  if(s.pinned){
    // gold lock badge
    ctx.fillStyle="#fbbf24";
    ctx.beginPath(); ctx.arc(x+13*sc,y-13*sc,8*sc,0,7); ctx.fill();
    ctx.lineWidth=2*sc; ctx.strokeStyle="#92400e";
    ctx.beginPath(); ctx.arc(x+13*sc,y-13*sc,8*sc,0,7); ctx.stroke();
    ctx.fillStyle="#92400e"; ctx.font=font(900,12*sc);
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("!",x+13*sc,y-12.5*sc);
  }
  ctx.restore();
}

function drawPlate(p){
  const L=Game.L;
  ctx.save();
  let dx=0, dy=0, rot=0, alpha=1, sc=1;
  if(p.popped){
    const k=easeIn(clamp(p.popT,0,1));
    dy=-140*k; rot=0.5*k; alpha=1-k; sc=1+0.15*k;
    dx=Math.sin(p.popT*30)*8*(1-k);
  }
  ctx.globalAlpha=alpha;
  // drop shadow
  ctx.fillStyle="rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(p.x+p.w/2,p.y+p.h+10,p.w*0.45,12,0,0,7); ctx.fill();
  ctx.translate(p.x+p.w/2+dx,p.y+p.h/2+dy);
  ctx.rotate(rot); ctx.scale(sc,sc); ctx.translate(-p.w/2,-p.h/2);
  const sp=plateSprite(p.w,p.h);
  ctx.drawImage(sp.img,0,0,p.w,p.h);
  ctx.restore();
  // screws on this plate (topmost = drawn)
  if(!p.popped){
    for(const s of p.screws){
      if(s.state!=="plate") continue;
      const blocked=Game.isBlocked(s);
      drawScrew(s,s.x,s.y,1,1,blocked);
    }
  }
}

function drawBin(){

/* ---------- main draw ---------- */
function draw(){
  if(!ctx) return;
  ctx.save();
  if(Game.shake>0) ctx.translate(rnd(-1,1)*Game.shake/50, rnd(-1,1)*Game.shake/50);
  drawBackground();
  const sc=Game.screen;
  if(sc==="title"){ drawTitle(); }
  else if(sc==="select"){ drawSelect(); }
  else if(Game.L){
    const L=Game.L;
    // plates low layer first
    const ps=L.plates.slice().sort((a,b)=>a.layer-b.layer);
    for(const p of ps) drawPlate(p);
    // flights above plates
    for(const f of L.flights){
      const s=f.screw;
      let x,y,sc2;
      if(f.phase==="unscrew"){
        const k=clamp(f.t/200,0,1);
        x=f.fx; y=f.fy-26*k; sc2=1+0.25*k;
      }else{
        const k=clamp(f.t/320,0,1), e=easeInOut(k);
        x=lerp(f.fx,f.tx,e); y=lerp(f.fy,f.ty,e)-Math.sin(k*Math.PI)*70; sc2=1.25-0.33*e;
      }
      drawScrew(s,x,y,sc2,1,false);
    }
    // clearing trio flights
    for(const c of L.clearing) drawScrew(c.screw,c.screw.x,c.screw.y,1,1,false);
    drawTray();
    drawParts(); drawFloats();
    drawHUD(); drawBottomBar();
    drawTut();
    if(L.winT>0) drawBanner("NICE!",null);
    if(L.loseT>0) drawBanner("JAMMED!",null);
    if(sc==="pause") drawPause();
    else if(sc==="win") drawWin();
    else if(sc==="lose") drawLose();
  }
  ctx.restore();
  if(Game.fade>0){
    ctx.globalAlpha=clamp(Game.fade/380,0,1);
    ctx.fillStyle="#04070f"; ctx.fillRect(0,0,LW,LH);
    ctx.globalAlpha=1;
  }
}

Game.onTap=function(x,y){
  Sfx.ensure(); Sfx.gesture();
  const ui=this.ui;
  if(this.screen==="title"){
    if(hit(x,y,ui.play)){ Sfx.click(); this.fade=380; this.screen="select"; try{Portal.gameplayStart();}catch(e){} return; }
    if(hit(x,y,ui.muteT)){ this.toggleMute(); return; }
    return;
  }
  if(this.screen==="select"){
    if(hit(x,y,ui.back)){ Sfx.click(); this.screen="title"; return; }
    for(let i=0;i<LEVELS.length;i++){
      if(hit(x,y,ui["lv"+i])){ Sfx.click(); this.levelIdx=i; this.fade=380; this.loadLevel(i); return; }
    }
    return;
  }
  if(this.screen==="play"){
    const L=this.L;
    if(hit(x,y,ui.pause)){ Sfx.click(); this.screen="pause"; try{Portal.gameplayStop();}catch(e){} return; }
    if(hit(x,y,ui.mute)){ this.toggleMute(); return; }
    if(hit(x,y,ui.undo)){ this.doUndo(); return; }
    if(hit(x,y,ui.hint)){ this.doHint(); return; }
    if(hit(x,y,ui.retry)){ Sfx.click(); this.loadLevel(this.levelIdx); return; }
    // screws: topmost = highest layer, then later plate
    let best=null, bd=1e9;
    for(const id of L.rem){
      const s=this.screwById(id);
      if(!s||s.state!=="plate") continue;
      const d=Math.hypot(x-s.x,y-s.y);
      if(d<30){
        if(!best||L.plates[s.plate].layer>L.plates[best.plate].layer||d<bd-12){ best=s; bd=d; }
      }
    }
    if(best){ this.tapScrewById(best.id); return; }
    return;
  }
  if(this.screen==="pause"){
    if(hit(x,y,ui.resume)){ Sfx.click(); this.screen="play"; try{Portal.gameplayStart();}catch(e){} }
    else if(hit(x,y,ui.restart)){ Sfx.click(); this.loadLevel(this.levelIdx); }
    else if(hit(x,y,ui.muteP)){ this.toggleMute(); }
    else if(hit(x,y,ui.mute)){ this.toggleMute(); }
    return;
  }
  if(this.screen==="win"){
    if(hit(x,y,ui.next)){
      Sfx.click();
      this.maybeInterstitial();
      const nx=Math.min(this.levelIdx+1,LEVELS.length-1);
      if(nx===this.levelIdx&&this.levelIdx>=LEVELS.length-1){ this.screen="select"; }
      else { this.levelIdx=nx; this.fade=380; this.loadLevel(nx); }
    }
    else if(hit(x,y,ui.replayW)){ Sfx.click(); this.fade=380; this.loadLevel(this.levelIdx); }
    else if(hit(x,y,ui.menuW)){ Sfx.click(); this.maybeInterstitial(); this.screen="select"; }
    return;
  }
  if(this.screen==="lose"){
    if(hit(x,y,ui.retryL)){ Sfx.click(); this.loadLevel(this.levelIdx); }
    else if(hit(x,y,ui.menuL)){ Sfx.click(); this.screen="select"; }
    return;
  }
};

/* ================= LOOP & BOOT ================= */
let lastT=0, frames=0;
function frame(t){
  try{
    if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
    let dt=Math.min(50,(t-lastT)||16); lastT=t;
    Game.tick(dt); draw(); frames++;
    if(frames===2){ try{ Portal.gameReady(); }catch(e){} }
  }catch(e){}
}
function applyProgress(v,merge){
  var coins=parseInt(v[0]||"0",10)||0,
      unlocked=parseInt(v[1]||"1",10)||1,
      completions=parseInt(v[5]||"0",10)||0, stars={};
  try{ stars=JSON.parse(v[2]||"{}"); }catch(e){ stars={}; }
  if(merge){
    /* Fusión conservadora: nunca se pierde progreso ganado en esta sesión. */
    if(coins>Game.coins) Game.coins=coins;
    if(unlocked>Game.unlocked) Game.unlocked=unlocked;
    if(completions>Game.completions) Game.completions=completions;
    for(var k in stars){ if(stars.hasOwnProperty(k)&&(!Game.stars[k]||stars[k]>Game.stars[k])) Game.stars[k]=stars[k]; }
    if(v[3]==="1"){ Game.muted=true; Sfx.muted=true; }
    if(v[4]==="1") Game.seenTut=true;
  }else{
    Game.coins=coins; Game.unlocked=unlocked; Game.stars=stars;
    Game.muted=v[3]==="1"; Sfx.muted=Game.muted;
    Game.seenTut=v[4]==="1"; Game.completions=completions;
  }
}
/* Re-lee el progreso con el Store activo. Los adaptadores de portal con
   storage async (Playgama) lo llaman cuando su SDK queda listo DESPUÉS
   del boot, porque el boot leyó el Store anterior (localStorage). */
window.__reapplyProgress=function(){
  return Promise.all([Store.get("coins"),Store.get("unlocked"),Store.get("stars"),
    Store.get("muted"),Store.get("seenTut"),Store.get("completions")])
    .then(function(v){ applyProgress(v,true); }).catch(function(){});
};
Promise.all([Store.get("coins"),Store.get("unlocked"),Store.get("stars"),
             Store.get("muted"),Store.get("seenTut"),Store.get("completions")]).then(v=>{
  applyProgress(v,false);
  try{ Portal.boot(); }catch(e){}
  try{
    const q=new URLSearchParams(location.search);
    if(q.get("shot")==="play"){
      Game.seenTut=true;
      Game.levelIdx=parseInt(q.get("level")||"1",10)-1;
      if(Game.levelIdx<0) Game.levelIdx=0;
      if(Game.levelIdx>=LEVELS.length) Game.levelIdx=LEVELS.length-1;
      Game.loadLevel(Game.levelIdx);
    }else if(q.get("shot")==="select"){ Game.screen="select"; }
  }catch(e){}
  if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(frame);
}).catch(()=>{ try{ Portal.boot(); }catch(e){} });

window.__SCREW_TEST__={
  version:"v2",
  state(){
    const L=Game.L;
    return {
      screen:Game.screen, level:Game.levelIdx+1,
      platesLeft:L?L.plates.filter(p=>!p.popped).length:0,
      screwsLeft:L?L.rem.length:0,
      tray:L?L.tray.map(id=>id==null?null:Game.screwById(id).color):[],
      holes:L?L.holes:0,
      moves:L?L.moves:0, undosLeft:L?L.undosLeft:0,
      stars:Game.stars, unlocked:Game.unlocked, coins:Game.coins,
    };
  },
  tappable(){ return Game.L?Game.tappable():[]; },
  tapScrew(i){
    const t=Game.tappable();
    if(i<0||i>=t.length) return false;
    return Game.tapScrewById(t[i]);
  },
  tapScrewById(id){ return Game.tapScrewById(id); },
  reset(){ Game.loadLevel(Game.levelIdx); return true; },
  gotoLevel(n){ Game.levelIdx=n-1; Game.loadLevel(n-1); return true; },
  undo(){ Game.doUndo(); return true; },
  autoWin(){
    // TEST ONLY: plays a solver-guided winning line through real tap logic
    const L0=Game.L;
    let guard=0;
    while(Game.screen==="play"&&guard<600){
      guard++;
      const L=Game.L;
      if(!L||L.rem.length===0) break;
      const rem=L.rem.filter(id=>{ const s=Game.screwById(id); return s&&s.state==="plate"; });
      let sol=null;
      try{ sol=solveState(rem,L.counts.slice(),L.plates,L.screws,L.K,L.holes,400); }catch(e){ sol=null; }
      let id=-1;
      if(sol&&sol.length){
        const s=Game.screwById(sol[0]);
        if(s&&!Game.isBlocked(s)) id=sol[0];
      }
      if(id<0){ const t=Game.tappable(); if(!t.length) break; id=t[0]; }
      Game.tapScrewById(id);
      // settle pending end-of-level timers instantly
      if(Game.L.winT>0){ Game.L.winT=-1; Game.onWin(); }
      if(Game.L.loseT>0){ Game.L.loseT=-1; Game.onLose(); }
    }
    return {won:Game.screen==="win", moves:Game.L?Game.L.moves:0, guard:guard};
  },
  forceLose(){
    // TEST ONLY: engineers a tray deadlock (holes full, no color x3),
    // then runs the real end-check -> lose transition
    const L=Game.L;
    if(!L||Game.screen!=="play") return {ok:false};
    const ids=L.rem.slice(0,L.holes);
    if(ids.length<L.holes) return {ok:false, reason:"not enough screws"};
    L.tray=new Array(L.holes).fill(null);
    L.flights=[];
    ids.forEach((id,h)=>{
      const s=Game.screwById(id);
      s.state="tray"; s.hole=h; L.tray[h]=id;
    });
    // counts with max<=2 (possible since H<=2K in every level)
    L.counts=new Array(L.K).fill(0);
    for(let h=0;h<L.holes;h++){
      let c=h%L.K, guard=0;
      while(L.counts[c]>=2&&guard<16){ c=(c+1)%L.K; guard++; }
      L.counts[c]++;
    }
    L.rem=L.rem.filter(id=>ids.indexOf(id)<0);
    Game.checkEnd();
    if(L.loseT>0){ L.loseT=-1; Game.onLose(); }
    return {ok:Game.screen==="lose"};
  },
};
</script>
